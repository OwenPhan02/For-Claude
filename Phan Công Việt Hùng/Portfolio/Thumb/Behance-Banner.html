<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f8f7f2;--green:#555d50;--beige:#ddd2c4;--line:#e6dbd0}
html,body{width:1600px;height:205px;overflow:hidden;background:var(--bg);font-family:"Hanken Grotesk",sans-serif;color:#111}
.wrap{position:relative;width:1600px;height:205px;overflow:hidden}
/* decorative side strips (may be cropped on small screens) */
.strip{position:absolute;top:60%;display:flex;gap:14px;transform:translateY(-50%) rotate(-6deg)}
.strip.l{left:-40px}.strip.r{right:-40px;transform:translateY(-50%) rotate(6deg)}
.card{flex:none;width:122px;aspect-ratio:16/10;border-radius:12px;overflow:hidden;border:3px solid #fff;box-shadow:0 14px 24px -12px rgba(0,0,0,.45)}
.card.t{width:60px;aspect-ratio:9/16}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.fade{display:none;position:absolute;top:0;bottom:0;width:520px;pointer-events:none}
.fade.l{left:230px;background:linear-gradient(90deg,rgba(248,247,242,0),var(--bg) 55%)}
.fade.r{right:230px;background:linear-gradient(270deg,rgba(248,247,242,0),var(--bg) 55%)}
/* centre safe zone */
.center{position:absolute;left:50%;top:61%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:34px}
.av{position:relative;width:132px;height:132px;flex:none}
.av .ring{position:absolute;inset:-12px;border-radius:50%;border:2px dashed var(--line)}
.av .disc{position:absolute;inset:0;border-radius:50%;background:var(--beige);overflow:hidden}
.av img{width:100%;height:118%;object-fit:cover;object-position:50% 0;filter:brightness(1.16) saturate(.88) contrast(1.03);display:block;margin-top:2px}
.tag{display:inline-block;padding:3px 11px;border:1.5px solid var(--green);border-radius:999px;font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--green)}
h1{margin-top:7px;font-size:40px;line-height:1;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.role{margin-top:8px;font-size:16px;font-weight:700;color:var(--green);white-space:nowrap}
.role span{font-weight:500;color:#6b7166}
.sep{width:2px;height:84px;background:var(--line);border-radius:2px}
.stats{display:grid;gap:8px}
.st{font-size:13px;font-weight:600;color:#555;white-space:nowrap}
.st b{font-size:22px;font-weight:700;color:#111;margin-right:6px}
.url{display:flex;align-items:center;gap:8px;margin-top:2px;font-size:13px;font-weight:600;color:var(--green)}
.url i{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--green);color:var(--bg);font-style:normal;font-size:12px}
</style></head><body><div class="wrap">
<div class="strip l">
  <div class="card"><img src="../assets/thumbs/mv-cozy-rain-1.jpg"></div>
  <div class="card t"><img src="../assets/thumbs/tt-01.jpg"></div>
  <div class="card"><img src="../assets/thumbs/mv-character-1.jpg"></div>
</div>
<div class="strip r">
  <div class="card"><img src="../assets/thumbs/mv-pixel-art-1.jpg"></div>
  <div class="card"><img src="../assets/thumbs/led-1.jpg"></div>
  <div class="card t"><img src="../assets/thumbs/tt-03.jpg"></div>
</div>
<div class="fade l"></div><div class="fade r"></div>
<div class="center">
  <div>
    <div class="tag">Portfolio</div>
    <h1>Phan Cong Viet Hung</h1>
    <div class="role">Editor Media <span>· Motion Video · Visual LED · TikTok · Design</span></div>
  </div>
  <div class="sep"></div>
  <div class="stats">
    <div class="st"><b>3</b>years experience</div>
    <div class="st"><b>99%</b>satisfaction</div>
    <div class="url"><i>→</i>owenphan02.github.io</div>
  </div>
</div>
</div></body></html>
